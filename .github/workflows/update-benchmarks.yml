name: Update benchmark reports

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: benchmark-report-update-${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'branch' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.versions.outputs.changed }}
      zc310: ${{ steps.versions.outputs.zc310 }}
      zc310_ref: ${{ steps.versions.outputs.zc310_ref }}
      ofdgo: ${{ steps.versions.outputs.ofdgo }}
      ofdrw: ${{ steps.versions.outputs.ofdrw }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Check latest library commits
        id: versions
        shell: bash
        run: |
          # go.sum is intentionally ignored in this repository; allow Go to create it in the runner.
          export GOWORK=off
          export GOFLAGS=-mod=mod
          zc310="$(GOWORK=off go list -m -f '{{.Version}}' github.com/zc310/ofd@main)"
          ofdgo="$(GOWORK=off go list -m -f '{{.Version}}' github.com/xiaoqidun/ofdgo@main)"
          metadata="$(mktemp)"
          trap 'rm -f "$metadata"' EXIT
          if ! curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 10 --retry-max-time 180 \
            --connect-timeout 15 --max-time 45 \
            --output "$metadata" \
            https://repo.maven.apache.org/maven2/org/ofdrw/ofdrw-converter/maven-metadata.xml; then
            echo "::error::Failed to download ofdrw Maven metadata after retries; latest version could not be checked." >&2
            exit 1
          fi
          ofdrw="$(python3 - "$metadata" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
          except (OSError, ET.ParseError) as error:
              sys.exit(f"::error::Invalid ofdrw Maven metadata: {error}")
          version = (root.findtext("versioning/release") or root.findtext("versioning/latest") or "").strip()
          if not version:
              sys.exit("::error::ofdrw Maven metadata has no release/latest version")
          print(version)
          PY
          )"
          changed="$(GOWORK=off go run ./tools/benchmark-versions -yaml docs/benchmark-results.yaml -zc310 "$zc310" -ofdgo "$ofdgo" -ofdrw "$ofdrw" -check)"
          zc310_ref="$zc310"
          if [[ "$zc310" =~ -([0-9a-f]{12})$ ]]; then
            short_sha="${BASH_REMATCH[1]}"
            zc310_ref="$(curl -fsSL "https://api.github.com/repos/zc310/ofd/commits/$short_sha" | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])')"
          fi
          echo "zc310=$zc310" >> "$GITHUB_OUTPUT"
          echo "zc310_ref=$zc310_ref" >> "$GITHUB_OUTPUT"
          echo "ofdgo=$ofdgo" >> "$GITHUB_OUTPUT"
          echo "ofdrw=$ofdrw" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "zc310=$zc310 ofdgo=$ofdgo ofdrw=$ofdrw changed=$changed"

  update:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BENCHMARK_OUTPUT_DIR: /tmp/ofd-benchmark
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout OFD fixtures
        uses: actions/checkout@v5
        with:
          repository: zc310/ofd-fixtures
          path: fixtures

      - name: Checkout zc310/ofd converter
        uses: actions/checkout@v5
        with:
          repository: zc310/ofd
          path: zc-ofd
          ref: ${{ needs.check.outputs.zc310_ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install system fonts and Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei fonts-noto-cjk fontconfig libfontconfig1-dev libcairo2-dev libfreetype-dev libjbig2dec0-dev pkg-config curl unzip maven

      - name: Install document fonts in user directory
        run: bash tools/install-fonts.sh

      - name: Install benchmark dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r python/requirements.txt
          python -m pip check
          python -m venv "$RUNNER_TEMP/pdf2ofd-venv"
          "$RUNNER_TEMP/pdf2ofd-venv/bin/python" -m pip install --only-binary=:all: --require-hashes -r python/requirements-pdf2ofd.txt
          "$RUNNER_TEMP/pdf2ofd-venv/bin/python" -m pip check
          echo "PDF2OFD_PYTHON=$RUNNER_TEMP/pdf2ofd-venv/bin/python" >> "$GITHUB_ENV"
          npm --prefix node ci
          mkdir -p java/lib
          mvn -B -f java/pom.xml -Dofdrw.version="${{ needs.check.outputs.ofdrw }}" dependency:copy-dependencies -DoutputDirectory="$GITHUB_WORKSPACE/java/lib"
          javac -cp "$(find java/lib -name '*.jar' -printf '%p:')" java/Ofd2Pdf.java java/Pdf2Ofd.java java/Ofd2Png.java

      - name: Prepare fixtures
        run: |
          mkdir -p testdata
          cp -a fixtures/testdata/. testdata/
          mkdir -p bin

      - name: Install ofdrw-rs native library
        run: |
          curl -fL -o /tmp/ofdrw-native.zip https://github.com/lihongjie0209/ofdrw-rs/releases/download/v0.5.0/ofdrw-native-linux-x64-v0.5.0.zip
          unzip -q /tmp/ofdrw-native.zip -d /tmp/ofdrw-native
          mkdir -p bin/ofdrw-rs
          install -m 0644 /tmp/ofdrw-native/ofdrw-native-linux-x64-v0.5.0/libofdrw_ffi.so bin/ofdrw-rs/libofdrw_ffi.so

      - name: Resolve latest Go converter libraries
        env:
          ZC310_VERSION: ${{ needs.check.outputs.zc310 }}
          OFDGO_VERSION: ${{ needs.check.outputs.ofdgo }}
        run: |
          export GOWORK=off
          go get "github.com/zc310/ofd@$ZC310_VERSION" "github.com/xiaoqidun/ofdgo@$OFDGO_VERSION"
          go list -m github.com/zc310/ofd github.com/xiaoqidun/ofdgo

      - name: Build benchmark tools and converters
        run: |
          export GOWORK=off
          export GOFLAGS=-mod=mod
          go test ./internal/benchmarkdata ./internal/converter ./tools/benchmark-versions ./tools/gen-benchmarks ./tools/update-benchmark-results
          go test ./cmd/pdf2ofd-benchmark
          go test ./cmd/ofd2png-benchmark
          python -m unittest discover -s tools -p 'test_*.py'
          go build -o bin/ofd-benchmark .
          go build -o bin/ofd2png-benchmark ./cmd/ofd2png-benchmark
          go build -o bin/zc310-png ./cmd/zc310-png
          go build -o bin/ofdgo-png ./cmd/ofdgo-png
          go build -o bin/ofdrw-rs-png ./cmd/ofdrw-rs-png
          cargo build --release --locked --manifest-path rust/ofdbox-folio-convert/Cargo.toml --target-dir rust/target
          cp rust/target/release/ofdbox-folio-convert bin/ofdbox-folio-convert
          cargo build --release --locked --manifest-path rust/linuxdeepin-rofd-png/Cargo.toml --target-dir rust/target
          cp rust/target/release/linuxdeepin-rofd-png bin/linuxdeepin-rofd-png
          cargo install sofd-cli --git https://github.com/emfox/sOFD --rev 65cff468ecc2af676180f540899fdf74da849c3a --locked --bin sofd --root "$RUNNER_TEMP/sofd-install"
          cp "$RUNNER_TEMP/sofd-install/bin/sofd" bin/sofd-cli
          cargo install --git https://github.com/ofd-utility/ofd-utility --rev d603791e933a81936b23c91dcab90fdc4c2c0edf --locked --bin ofd-cli --root "$RUNNER_TEMP/ofd-utility-install" ofd-cli
          cp "$RUNNER_TEMP/ofd-utility-install/bin/ofd-cli" bin/ofd-utility-cli
          cargo install --git https://github.com/feuvan/ofdmanager --rev a9b1d29ef90141a369ad47cc32fd6c62dd8b8450 --locked --bin ofd-cli --root "$RUNNER_TEMP/ofdmanager-install" ofd-cli
          cp "$RUNNER_TEMP/ofdmanager-install/bin/ofd-cli" bin/ofdmanager-cli
          go build -o bin/ofdgo-convert ./cmd/ofdgo-convert
          go build -o bin/ofdrw-rs-convert ./cmd/ofdrw-rs-convert
          go build -o bin/zc310-convert ./cmd/zc310-convert
          go build -o bin/ofdgo-pdf2ofd ./cmd/ofdgo-pdf2ofd
          go build -o bin/pdf2ofd-benchmark ./cmd/pdf2ofd-benchmark
          go build -o bin/gen-benchmarks ./tools/gen-benchmarks
          go build -o bin/update-benchmark-results ./tools/update-benchmark-results
          go build -o bin/benchmark-versions ./tools/benchmark-versions
          (cd zc-ofd && GOWORK=off go build -o "$GITHUB_WORKSPACE/bin/ofd-converter" ./cmd/ofd-converter)

      - name: Reset this run's measurements
        run: bin/update-benchmark-results -yaml docs/benchmark-results.yaml -reset

      - name: Run OFD to PDF benchmarks
        run: |
          for name in hello ano intro 1000-pages 999 zsbk; do
            if [[ "$name" == "hello" || "$name" == "1000-pages" ]]; then
              input="testdata/ofd-creator/$name.ofd"
            else
              input="testdata/ofdrw/$name.ofd"
            fi
            test -n "$input" || { echo "Missing OFD fixture: $name"; exit 1; }
            test -f "$input" || { echo "Missing OFD fixture: $input"; exit 1; }
            bin/ofd-benchmark "$input"
          done

      - name: Run PDF to OFD benchmarks
        run: |
          for name in hello ano 999 intro zsbk 1000-pages GBT_33190-2016; do
            if [[ "$name" == "GBT_33190-2016" ]]; then
              input="testdata/standards/$name.pdf"
            else
              input="testdata/suwell/$name.pdf"
            fi
            test -f "$input" || { echo "Missing PDF fixture: $input"; exit 1; }
            bin/pdf2ofd-benchmark "$input"
          done

      - name: Run native OFD to PNG benchmarks (200 DPI)
        run: |
          for name in 999 intro zsbk; do
            test -d "testdata/suwell/$name" || { echo "Missing 200 DPI Suwell PNG fixtures: $name"; exit 1; }
            bin/ofd2png-benchmark "testdata/ofdrw/$name.ofd"
          done

      - name: Measure OFD to PNG quality (all pages)
        env:
          BENCHMARK_RESULTS_WRITER: ${{ github.workspace }}/bin/update-benchmark-results
        run: python tools/compare_png.py

      - name: Upload native PNG benchmark outputs
        uses: actions/upload-artifact@v6
        with:
          name: ofd-to-png-200dpi
          path: ${{ env.BENCHMARK_OUTPUT_DIR }}/output_png/
          if-no-files-found: warn
          retention-days: 7

      - name: Create PDF to OFD round-trip artifacts
        run: bash tools/roundtrip-pdf2ofd.sh bin/ofd-converter "$BENCHMARK_OUTPUT_DIR/output_ofd"

      - name: Measure OFD to PDF quality
        env:
          BENCHMARK_RESULTS_WRITER: ${{ github.workspace }}/bin/update-benchmark-results
        run: |
          python tools/compare_pdf.py 96 hello ano intro 1000-pages 999 zsbk
          python tools/compare_text.py hello ano intro 1000-pages 999 zsbk

      - name: Measure PDF to OFD round-trip quality
        env:
          BENCHMARK_RESULTS_WRITER: ${{ github.workspace }}/bin/update-benchmark-results
        run: python tools/compare_pdf2ofd.py 96 hello ano 999 intro zsbk 1000-pages GBT_33190-2016

      - name: Record benchmarked library versions
        env:
          ZC310_VERSION: ${{ needs.check.outputs.zc310 }}
          OFDGO_VERSION: ${{ needs.check.outputs.ofdgo }}
          OFDRW_VERSION: ${{ needs.check.outputs.ofdrw }}
        shell: bash
        run: |
          os_name="$(. /etc/os-release; printf '%s (%s)' "$PRETTY_NAME" "$(uname -m)")"
          cpu_model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
          cores="$(nproc)"
          memory="$(awk '/MemTotal/ {printf "%.1f GiB", $2/1024/1024}' /proc/meminfo)"
          bin/benchmark-versions -yaml docs/benchmark-results.yaml -zc310 "$ZC310_VERSION" -ofdgo "$OFDGO_VERSION" -ofdrw "$OFDRW_VERSION" -os "$os_name" -cpu "$cpu_model" -cores "$cores" -memory "$memory" -write

      - name: Generate Markdown reports
        run: |
          bin/gen-benchmarks
          bin/gen-benchmarks -check
          git diff --check

      - name: Commit updated benchmark data and reports
        if: github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmark-results.yaml docs/ofd-to-pdf.md docs/pdf-to-ofd.md docs/ofd-to-png.md docs/charts/*.svg
          if git diff --cached --quiet; then
            echo "Benchmark reports are unchanged."
            exit 0
          fi
          git commit -m "docs: update benchmark reports"
          git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git rebase --autostash "origin/${GITHUB_REF_NAME}"
          GOWORK=off GOFLAGS=-mod=mod go run ./tools/gen-benchmarks -check
          git diff --check
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Package benchmark release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/package_benchmark_release.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/benchmark-release"

      - name: Upload benchmark release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-release
          path: ${{ runner.temp }}/benchmark-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: update
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: benchmark-release
          path: ${{ runner.temp }}/benchmark-release

      - name: Publish benchmark release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/publish-benchmark-release.sh "$RUNNER_TEMP/benchmark-release"
