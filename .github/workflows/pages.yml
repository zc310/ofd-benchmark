name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "tools/build-pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Update benchmark reports"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Prepare documentation
        run: python3 tools/build-pages.py docs _pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: _pages
          destination: _site
      - name: Verify rendered tables
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class TableCounter(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.count = 0

              def handle_starttag(self, tag, attrs):
                  if tag == "table":
                      self.count += 1

          for source in Path("_pages").rglob("*.md"):
              markdown = source.read_text(encoding="utf-8")
              expected = len(re.findall(r"^\|[^\n]*\|\s*\n\|[ \t:|-]+\|[ \t]*$", markdown, re.MULTILINE))
              if not expected:
                  continue
              page = Path("_site") / source.relative_to("_pages").with_suffix(".html")
              counter = TableCounter()
              counter.feed(page.read_text(encoding="utf-8"))
              if counter.count != expected:
                  raise SystemExit(f"{page}: expected {expected} tables, rendered {counter.count}")
              print(f"{page}: {counter.count} tables")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
