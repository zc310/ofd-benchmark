title: "OFD 库汇总"

sections:
  - lang: "go"
    title: "Go"
  - lang: "rust"
    title: "Rust"
  - lang: "python"
    title: "Python"
  - lang: "java"
    title: "Java"
  - lang: "cpp"
    title: "C++"
  - lang: "dotnet"
    title: ".NET"
  - lang: "javascript"
    title: "JavaScript"
  - lang: "pascal"
    title: "Pascal"

columns:
  - key: "name"
    header: "库"
    structural: true
  - key: "license"
    header: "许可证"
    structural: true
  - key: "preview"
    header: "预览"
    legend: "库是否内置 OFD 预览/显示能力（查看器、浏览器渲染或可视化组件）。"
  - key: "parse"
    header: "解析"
  - key: "fapiao"
    header: "发票"
    legend: "库是否支持电子发票类 OFD 处理（发票解析/信息提取、验签验章、发票渲染等）。⚠️ 为可兼容发票文档的通用 OFD 库，但无发票专项功能。"
  - key: "to_img"
    header: "→ 图片"
  - key: "to_pdf"
    header: "→ PDF"
  - key: "to_txt"
    header: "→ TXT"
  - key: "to_svg"
    header: "→ SVG"
  - key: "to_md"
    header: "→ Md"
  - key: "to_html"
    header: "→ HTML"
    legend: "库是否支持 OFD → HTML（网页/浏览器渲染）输出。⚠️ 为在浏览器中基于 Canvas 渲染显示但不直接生成 HTML DOM/SVG 结构的库。"
  - key: "pdf_to_ofd"
    header: "PDF → OFD"
    legend: "库是否支持 PDF 转 OFD 导入。⚠️ 为部分支持（仅文本/图片、或对非嵌入字体等常见 PDF 直接失败）。"
  - key: "gen"
    header: "生成"
  - key: "sign"
    header: "签章"
  - key: "crypto"
    header: "加密文档"
    legend: "库是否支持 OFD 文档级加密/解密（GM/T 0099-2020 密码应用：口令/证书加密、解密打开）。⚠️ 为部分支持（如仅加密不支持解密打开）。据公开资料核查。"
  - key: "print"
    header: "打印"
    legend: "库是否内置 OFD 打印能力（系统打印管线/打印对话框，或按页渲染后走浏览器/系统打印）。"
  - key: "search"
    header: "检索"
    legend: "库是否支持文档内全文检索/关键词定位（含跨对象文字搜索、命中跳页）。"
  - key: "annot"
    header: "注释"
    legend: "库是否支持 OFD 注释对象（Annots）的读取（解析/渲染）或写入。"
  - key: "archive"
    header: "归档"
    legend: "库是否支持长期归档能力（归档预检/清单/封装准备，如 GB/T 33190、GB/T 42133）。"
  - key: "modify"
    header: "修改"
  - key: "editor"
    header: "编辑器"
    legend: "库是否附带可视化编辑界面（GUI/WYSIWYG，可交互增删改文档内容），区别于「修改」的 API 程序化修改。"

